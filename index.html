<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My Task List</h1>
        </header>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a new task..." maxlength="100">
            <button id="addButton">Add</button>
        </div>
        
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="not-completed">Not Completed</button>
        </div>
        
        <div class="tasks-section">
            <h2>My Tasks:</h2>
            <ul id="taskList"></ul>
            <div id="emptyMessage" class="empty-message">No tasks yet. Add one above!</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
